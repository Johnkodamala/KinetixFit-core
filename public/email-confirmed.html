<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confirmed | Kinetix Fit</title>
  <meta name="description" content="Your Kinetix Fit email address is confirmed." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'%3E%3Cpath d='M25 45C35 45 45 35 50 25C55 15 65 5 75 5C85 5 95 15 95 25C95 35 85 45 75 45C65 45 55 35 50 25C45 15 35 5 25 5C15 5 5 15 5 25C5 35 15 45 25 45Z' stroke='%23E5532D' stroke-width='8' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/legal-pages.css" />
</head>
<body>
  <!-- Where the sign-up confirmation email's link lands (src/lib/auth.ts EMAIL_CONFIRMED_URL, /email-confirmed in
       vercel.json). Supabase confirms the address before sending people here; a link that failed (expired, or already
       used) arrives with error_code in the address instead. -->
  <header class="legal-header">
    <div class="legal-header-inner">
      <a href="/">
        <svg width="28" height="14" viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M25 45C35 45 45 35 50 25C55 15 65 5 75 5C85 5 95 15 95 25C95 35 85 45 75 45C65 45 55 35 50 25C45 15 35 5 25 5C15 5 5 15 5 25C5 35 15 45 25 45Z" stroke="#E5532D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Kinetix Fit
      </a>
    </div>
  </header>

  <main class="legal-doc" style="text-align:center">
    <h1 id="title">Your email is confirmed</h1>
    <p id="message" style="font-size:17px;margin-top:16px">Go back to the Kinetix Fit app and log in with your email and password.</p>
    <p id="hint" class="legal-hint">Using Kinetix Fit on the web? <a href="/app/">Log in here</a>.</p>
  </main>

  <script>
    // A link that didn't work comes back with error details in the address (#error_code=otp_expired…)
    const params = new URLSearchParams(window.location.hash.slice(1) || window.location.search.slice(1));
    if (params.get('error') || params.get('error_code')) {
      document.getElementById('title').textContent = 'That link didn’t work';
      document.getElementById('message').textContent = params.get('error_code') === 'otp_expired'
        ? 'It has expired or was already used. If you already confirmed, just log in to the app. If not, open the app, tap Log in, and send the confirmation email again.'
        : 'Open the Kinetix Fit app, tap Log in, and send the confirmation email again.';
      document.title = 'Link expired | Kinetix Fit';
    }
    // the link's details aren't needed on the page, and shouldn't sit in the browser's history
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);
  </script>
</body>
</html>
